name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn tsc --noEmit -p tsconfig.json
      - run: yarn lint
      - run: yarn test
      # Builds the library, runs the production build of the example with it and checks its main screens.
      - run: yarn health-check
